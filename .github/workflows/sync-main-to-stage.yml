name: Sync main to stage

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-main-to-stage
  cancel-in-progress: true

jobs:
  sync:
    name: Merge main into stage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Attempt merge
        id: merge
        run: |
          git checkout -b stage origin/stage
          if git merge origin/main --no-edit; then
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "result=conflict" >> $GITHUB_OUTPUT
          fi

      - name: Push if clean merge
        if: steps.merge.outputs.result == 'success'
        run: |
          git push origin stage

      - name: Create PR if conflict
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git merge --abort
          EXISTING_PR=$(gh pr list --base stage --head main --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists"
            exit 0
          fi
          gh pr create \
            --title "Sync main → stage (merge conflict)" \
            --body "Automatic merge of main into stage failed due to conflicts. Please resolve manually." \
            --base stage \
            --head main
